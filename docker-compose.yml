services:
  backend:
    build:
      context: .                              # ← Корень проекта
      dockerfile: ./docker/backend/Dockerfile
    container_name: laravel-backend
    restart: unless-stopped
    ports:
      - "80:80"
      # - "443:443"  # ← Закомментирован HTTPS
    volumes:
      - ./backend:/var/www/html
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=80"]  # ← ДОБАВИТЬ!
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=database
      - DB_PORT=3306
      - DB_DATABASE=myapp
      - DB_USERNAME=administrator
      - DB_PASSWORD=qwerty123
      - LARAVEL_AUTO_MIGRATION=1
    depends_on:
      - database
    networks:
      - app-network

  database:
    image: mysql:8.0
    container_name: mysql-database
    restart: unless-stopped
    ports:
      - "3333:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: myapp
      MYSQL_USER: administrator
      MYSQL_PASSWORD: qwerty123
    volumes:
      - ./docker/mysql:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  frontend:
    build:
      context: .                              # ← Тоже корень проекта!
      dockerfile: ./docker/frontend/Dockerfile
    container_name: vue-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - VITE_APP_API_URL=http://localhost/api
    networks:
      - app-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: database
      PMA_PORT: 3306
    networks:
      - app-network
    depends_on:
      - database

networks:
  app-network:
    driver: bridge